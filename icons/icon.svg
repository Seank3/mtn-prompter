<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MM Money Prompter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- prompt caret -->
  <path d="M150 150 L150 362 L196 318 L226 392 L268 372 L238 300 L306 300 Z"
        fill="url(#mark)"/>

  <!-- money / ledger lines -->
  <g fill="#34d399" opacity="0.55">
    <rect x="310" y="176" width="122" height="18" rx="9"/>
    <rect x="310" y="222" width="92"  height="18" rx="9"/>
    <rect x="310" y="268" width="140" height="18" rx="9"/>
    <rect x="310" y="314" width="70"  height="18" rx="9"/>
  </g>
</svg>
